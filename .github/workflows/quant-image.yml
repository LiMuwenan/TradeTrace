name: quant · build & push image

# push main（含 PR 合并后的提交）→ 测试通过后构建并推送 GHCR；
# PR 只跑测试，不推镜像；workflow_dispatch 用于手动重建。
on:
  push:
    branches: [main]
    paths:
      - "quant/**"
      - ".github/workflows/quant-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "quant/**"
      - ".github/workflows/quant-image.yml"
  workflow_dispatch:

# 同一分支只留最新一次；PR 新提交取消旧任务，main 不取消，避免发布做到一半被打断
concurrency:
  group: quant-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 默认最小权限；只有镜像任务额外申请 packages: write
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: 测试（pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: quant/backend/pyproject.toml

      # 依赖清单只有 pyproject 一份：与 Dockerfile 同样从 [project].dependencies 抽取，
      # 再补测试专用的 pytest / httpx（等价于 .[dev]），不额外维护 requirements.txt
      - name: 安装依赖
        working-directory: quant/backend
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > /tmp/requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/requirements.txt "pytest>=8.0" "httpx>=0.27"

      - name: 运行测试
        working-directory: quant/backend
        run: python -m pytest -q

  image:
    name: 构建并推送镜像
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 仓库名带大写（TradeTrace），GHCR 只接受小写，统一在这里转一次
      - name: 计算镜像名
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/quant" >> "$GITHUB_OUTPUT"

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 登录 GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签用 git SHA，可追溯到具体提交；再给分支名方便家用部署拉 main
      - name: 生成标签与 OCI 元数据
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=quant
            org.opencontainers.image.description=A 股量化数据分析与预警平台（只读行情，不接交易）

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: quant
          file: quant/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=quant
          cache-to: type=gha,mode=max,scope=quant
          # 供应链可追溯：附带构建来源与 SBOM
          provenance: true
          sbom: true

      # 镜像能起来、接口能通才算发布成功；数据目录用容器内匿名卷，不碰宿主数据
      - name: 冒烟验证
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          # 冒烟只验证进程能起、接口能通：关掉定时流水线，避免在 CI 里触发取数
          printf '[schedule]\nenabled = false\n' > "$RUNNER_TEMP/smoke.toml"
          docker run -d --name quant-smoke -p 18000:8000 \
            -e QUANT_CONFIG=/app/config/smoke.toml \
            -v "$RUNNER_TEMP/smoke.toml:/app/config/smoke.toml:ro" \
            "$IMAGE_REF"
          trap 'docker rm -f quant-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/v1/health -o /tmp/health.json; then break; fi
            sleep 2
          done
          python -c "import json; data = json.load(open('/tmp/health.json')); assert data['data']['status'] == 'ok', data; print(data['data'])"
          docker rm -f quant-smoke

      - name: 写入任务摘要
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### quant 镜像已推送"
            echo ""
            echo '```'
            echo "$TAGS"
            echo '```'
            echo ""
            echo "- 摘要：\`$DIGEST\`"
            echo "- 固定版本拉取：\`docker pull $IMAGE_NAME@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
