# 种子规则示例：06 号票（规则编辑页）上线前用于调试求值。
# 用法：python -m app.import_rules config/rules.example.toml
#
# 字段口径见 05 票「规则口径」表：
#   type       breakout | oversold | volume_surge | volume_shrink | ma_cross
#   scope      watchlist（全部自选） | single（需配 scope_code）
#   window     时间窗 N，整数且不小于 2
#   threshold  仅超跌与量比类需要：超跌为百分数（20 表示跌 20%），量比为倍数
#   enabled    省略即启用

[[rules]]
type = "breakout"
name = "突破 60 日高点"
window = 60

[[rules]]
type = "oversold"
name = "60 日回撤 20%"
window = 60
threshold = 20.0

[[rules]]
type = "volume_surge"
name = "放量 1.5 倍"
window = 5
threshold = 1.5

[[rules]]
type = "volume_shrink"
name = "缩量到 0.6 倍"
window = 5
threshold = 0.6

[[rules]]
type = "ma_cross"
name = "站上 20 日均线"
window = 20
